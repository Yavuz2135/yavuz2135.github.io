<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>YavuKan Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="splash-screen" class="splash"><div id="yavukan-logo" class="logo">YavuKan</div></div>
    
    <div id="main-menu" class="container hidden">
        <h1>Yavuz'un Oyunları</h1>
        <div class="game-grid">
            <div class="game-card active" id="btn-neon"><h2>Neon Velocity</h2></div>
            <div class="game-card active" id="btn-oyun3"><h2>Uzay Fırtınası</h2></div>
        </div>
    </div>

    <div id="game-container" class="hidden">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div>Skor: <span id="score">0</span></div>
            <button id="btn-back-to-menu">MENÜ</button>
        </div>
        <div id="game-over-screen" class="hidden overlay">
            <h2>Oyun Bitti</h2>
            <p>Skor: <span id="final-score">0</span></p>
            <button id="btn-restart">Tekrar Oyna</button>
        </div>
    </div>

    <script src="main.js"></script>
    <script src="oyun3.js"></script>
    <script src="oyun1.js"></script>
</body>
</html>
