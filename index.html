<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YavuKan Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

    <div id="splash-screen" class="splash">
        <div id="yavukan-logo" class="logo">YavuKan</div>
    </div>

    <div id="main-menu" class="container hidden">
        <header>
            <h1 class="glitch">YavuKan Games</h1>
        </header>
        <div class="game-grid" id="game-grid"></div>
        <footer><p>© 2026 YavuKan</p></footer>
    </div>

    <div id="game-container" class="hidden">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="score-board">
                Skor: <span id="score">0</span>
                <span id="lives" class="hidden"></span>
                <span id="combo" class="hidden"></span>
            </div>
            <button id="btn-global-exit">ANA MENÜ</button>
        </div>
        <div id="game-over-screen" class="hidden overlay">
            <h2>Oyun Bitti!</h2>
            <p>Skor: <span id="final-score">0</span></p>
            <p id="high-score-container" class="hidden">En Yüksek: <span id="high-score">0</span></p>
            <button id="btn-restart">TEKRAR OYNA</button>
            <button id="btn-menu-exit">ANA MENÜYE DÖN</button>
        </div>
    </div>

    <script src="assets/js/utils.js"></script>
    <script src="main.js"></script>

</body>
</html>
