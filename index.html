<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YavuKan Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="splash-screen" class="splash">
        <div id="yavukan-logo" class="logo">YavuKan</div>
    </div>

    <div id="main-menu" class="container hidden">
        <header><h1 class="glitch">YavuKan Games</h1></header>
        <div class="game-grid">
            <div class="game-card active" id="btn-neon">
                <div class="card-content">
                    <h2>Neon Velocity</h2>
                    <span class="play-btn">Oyna</span>
                </div>
            </div>
            <div class="game-card locked">
                <div class="card-content"><h2>Yeni Proje</h2></div>
            </div>
        </div>
        <footer><p>&copy; 2026 YavuKan</p></footer>
    </div>

    <div id="game-container" class="hidden">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="score-board">Skor: <span id="score">0</span></div>
            <button id="btn-global-exit">MENÜ</button>
        </div>
        <div id="game-over-screen" class="hidden overlay">
            <h2>Oyun Bitti</h2>
            <p>Skor: <span id="final-score">0</span></p>
            <button id="btn-restart">TEKRAR</button>
            <button id="btn-menu-exit">MENÜ</button>
        </div>
    </div>

    <script src="main.js"></script>
    <script src="oyun1.js"></script>
</body>
</html>
